<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boussole">
<title>Boussole</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<style>
  :root { --bg:#1e1b4b; --fg:#fff; --accent:#ff7a59; --violet:#a855f7; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:'Sansation','Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f3f4fb; opacity:0; transition:opacity .4s; }
  #app.ready { opacity:1; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px;
    background:radial-gradient(900px 500px at 10% 0%,#7c3aed55,transparent),radial-gradient(700px 400px at 100% 100%,#ff7a5944,transparent),linear-gradient(160deg,#1e1b4b,#312e81 55%,#4c1d95); transition:opacity .4s; z-index:5; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:104px; height:104px; border-radius:28px; box-shadow:0 18px 40px -10px rgba(255,122,89,.6); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  #splash h1 { margin:0; font-size:2rem; letter-spacing:.5px; }
  #splash p { margin:0; opacity:.8; }
  .bar { width:160px; height:4px; border-radius:4px; background:rgba(255,255,255,.18); overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; background:linear-gradient(90deg,var(--accent),var(--violet)); animation:load 1.2s ease-in-out infinite; }
  @keyframes load { 0% { transform:translateX(-100%); } 100% { transform:translateX(260%); } }
  .msg { max-width:420px; background:rgba(255,255,255,.12); border-radius:16px; padding:14px 18px; line-height:1.5; font-size:.95rem; }
  .btn { border:0; cursor:pointer; font:inherit; font-weight:700; color:#fff; padding:12px 20px; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--violet)); box-shadow:0 10px 24px -10px rgba(255,122,89,.7); }
  .btn.ghost { background:rgba(255,255,255,.16); box-shadow:none; }
  #pill { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:none; align-items:center; gap:10px;
    background:#1e1b4b; color:#fff; padding:10px 12px 10px 16px; border-radius:18px; box-shadow:0 14px 40px -10px rgba(0,0,0,.5); font-size:.9rem; max-width:calc(100% - 32px); }
  #pill.show { display:flex; }
  #pill .btn { padding:8px 14px; border-radius:12px; font-size:.85rem; }
  #pill .x { background:none; border:0; color:#fff; opacity:.7; font-size:1.1rem; cursor:pointer; }
  /* Enregistreur et dictee du lanceur (le micro est autorise ici, pas dans la page Google) */
  #rec { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(15,16,32,.55); backdrop-filter:blur(3px); padding:16px; }
  #rec.show { display:flex; }
  #rec .box { width:100%; max-width:360px; background:#fff; color:#1b1e33; border-radius:24px; padding:26px 22px; text-align:center; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); }
  #rec .mic { width:84px; height:84px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center; font-size:2.2rem; background:linear-gradient(135deg,#ef4444,#ff7a59); animation:micp 1.4s infinite; }
  @keyframes micp { 0% { box-shadow:0 0 0 0 rgba(239,68,68,.55); } 70% { box-shadow:0 0 0 22px rgba(239,68,68,0); } 100% { box-shadow:0 0 0 0 rgba(239,68,68,0); } }
  #rec .t { font-size:2.2rem; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0; }
  #rec .sub { color:#6c7192; font-size:.9rem; margin:0 0 6px; }
  #rec .live { min-height:48px; background:#f3f4fb; border-radius:14px; padding:10px 12px; margin:10px 0; text-align:left; font-size:.95rem; line-height:1.4; }
  #rec .bars { display:flex; gap:3px; align-items:flex-end; justify-content:center; height:36px; margin:8px 0 14px; }
  #rec .bars i { width:5px; height:15%; border-radius:3px; background:linear-gradient(#ff7a59,#a855f7); transition:height .08s; }
  #rec .row { display:flex; gap:10px; justify-content:center; }
  #rec .btn2 { border:0; cursor:pointer; font:inherit; font-weight:700; padding:12px 18px; border-radius:14px; background:#eef0fb; color:#1b1e33; }
  #rec .btn2.pri { background:linear-gradient(135deg,#6d5dfc,#a855f7); color:#fff; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-512.png" alt="">
  <h1>Boussole</h1>
  <p>Garder le cap, chaque jour</p>
  <div class="bar" id="bar"><i></i></div>
  <div id="note"></div>
</div>
<iframe id="app" title="Boussole" allow="camera *; microphone *; clipboard-write *; fullscreen *; autoplay *; geolocation *"></iframe>
<div id="rec" role="dialog" aria-modal="true"><div class="box" id="recbox"></div></div>
<div id="pill" role="status"><span id="pilltxt"></span><button class="btn" id="pillbtn"></button><button class="x" id="pillx" aria-label="Fermer">✕</button></div>

<script>
(function () {
  const URL_APP = (window.BOUSSOLE_URL || '').trim();
  const splash = document.getElementById('splash'), frame = document.getElementById('app'), note = document.getElementById('note'), bar = document.getElementById('bar');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* 1. Rendre l'appli installable (service worker) */
  let swReg = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});

  /* 2. Lien pas encore réglé */
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(URL_APP)) {
    bar.style.display = 'none';
    note.innerHTML = '<div class="msg">⚙️ <b>Encore une étape :</b> ouvre le fichier <b>config.js</b> et colle le lien de ton appli Apps Script (celui qui se termine par <b>/exec</b>).</div>';
    return;
  }

  /* 3. Charger Boussole dans la fenêtre de l'appli */
  const show = () => { frame.classList.add('ready'); splash.classList.add('hide'); };
  frame.addEventListener('load', () => setTimeout(show, 300));
  const SRC = URL_APP + (URL_APP.indexOf('?') >= 0 ? '&' : '?') + 'app=1';
  frame.src = SRC;
  // Message seulement si l'ouverture prend VRAIMENT longtemps (réseau faible)
  setTimeout(() => { if (!frame.classList.contains('ready')) note.innerHTML = '<div class="msg">📶 Le réseau est faible… Boussole arrive.</div>'; }, 15000);
  setTimeout(() => { if (!frame.classList.contains('ready')) note.innerHTML = '<div class="msg">📶 Le réseau est très faible.<br><button class="btn ghost" onclick="location.reload()" style="margin-top:10px">Réessayer</button></div>'; }, 45000);
  if (!navigator.onLine) { bar.style.display = 'none'; note.innerHTML = '<div class="msg">📶 Pas de connexion Internet. Boussole s\'ouvrira dès que le réseau revient.</div>'; }
  window.addEventListener('online', () => { if (!frame.classList.contains('ready')) frame.src = SRC; });

  /* 4. Petite bulle en bas : installer l'appli / activer les rappels */
  const pill = document.getElementById('pill'), txt = document.getElementById('pilltxt'), btn = document.getElementById('pillbtn');
  let action = null;
  const ask = (t, b, fn) => { txt.textContent = t; btn.textContent = b; action = fn; pill.classList.add('show'); };
  document.getElementById('pillx').onclick = () => { pill.classList.remove('show'); if (action && action.key !== 'notif') store.set('boussole_pill_' + action.key, '1'); };
  btn.onclick = () => { if (action) action(); };

  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    const f = () => { deferred.prompt(); deferred.userChoice.finally(() => { deferred = null; pill.classList.remove('show'); }); }; f.key = 'install';
    if (!standalone) ask('📲 Installe Boussole comme une vraie appli', 'Installer', f);
  });
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isiOS && !standalone && !store.get('boussole_pill_ios')) { const f = () => pill.classList.remove('show'); f.key = 'ios'; ask('📲 Pour installer : bouton Partager ⬆️ puis « Sur l\'écran d\'accueil »', 'OK', f); }

  /* Notifications : on ne redemande JAMAIS si c'est déjà autorisé ; si c'est refusé, on explique où l'activer.
     Sans réponse claire, on ne repropose la bulle qu'une fois par semaine. */
  let appWin = null;
  const notifState = () => !('Notification' in window) ? 'none' : Notification.permission;
  const tellApp = () => { if (appWin) try { appWin.postMessage({ boussole: 'notifState', state: notifState() }, '*'); } catch (x) {} };
  const WEEK = 7 * 86400000;
  const notifAsk = force => {
    const st = notifState();
    if (st === 'granted' || st === 'none') return tellApp();
    if (st === 'denied') {
      if (!force) return;
      const f = () => pill.classList.remove('show'); f.key = 'notifhelp';
      return ask(isAndroid ? '🔕 Rappels bloqués : Paramètres du téléphone › Applications › Boussole › Notifications › Autoriser' : '🔕 Rappels bloqués : clique 🔒 à gauche de l’adresse › Notifications › Autoriser', 'OK', f);
    }
    if (!force && Date.now() - (+store.get('boussole_notif_asked') || 0) < WEEK) return;
    store.set('boussole_notif_asked', String(Date.now()));
    const f = () => Notification.requestPermission().then(tellApp).finally(() => pill.classList.remove('show')); f.key = 'notif';
    ask('🔔 Active les rappels sur cet appareil', 'Activer', f);
  };
  const isAndroid = /android/i.test(navigator.userAgent);
  if (standalone) setTimeout(() => notifAsk(false), 4000);
  try { navigator.permissions.query({ name: 'notifications' }).then(p => { p.onchange = () => { tellApp(); if (notifState() === 'granted') pill.classList.remove('show'); }; }); } catch (x) {}

  /* 5. Relais des rappels : Boussole (dans la fenêtre) demande une notification système */
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (!d.boussole) return;
    if (d.boussole === 'notify') {
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (x) {}
      if ('Notification' in window && Notification.permission === 'granted') {
        const opts = { body: d.body || '', icon: 'icon-192.png', badge: 'icon-192.png', tag: d.tag || d.title, renotify: true, requireInteraction: true, vibrate: [300, 150, 300] };
        (swReg && swReg.showNotification ? swReg.showNotification(d.title, opts) : Promise.reject()).catch(() => { try { new Notification(d.title, opts); } catch (x) {} });
      }
    }
    appWin = e.source || appWin;
    if (d.boussole === 'askNotif') notifAsk(true);
    if (d.boussole === 'notifState?') tellApp();
    if (d.boussole === 'ready') { show(); tellApp(); }
    if (d.boussole === 'rec') { reply(e, { boussole: 'recAck', rid: d.rid }); startRec(e, d); }
    if (d.boussole === 'dict') { reply(e, { boussole: 'dictAck', rid: d.rid }); startDict(e, d); }
  });

  /* 6. Micro : enregistrement et dictée faits ICI, puis renvoyés à Boussole.
     (On n'ouvre jamais l'enregistreur du téléphone : Android fermerait l'appli.) */
  const recEl = document.getElementById('rec'), recBox = document.getElementById('recbox');
  const reply = (e, m) => { try { e.source.postMessage(m, '*'); } catch (x) {} };
  const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const closeRec = () => { recEl.classList.remove('show'); recBox.innerHTML = ''; };
  let REC = null;
  function startRec(e, d) {
    if (REC) return reply(e, { boussole: 'recResult', rid: d.rid, err: 'busy' });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return reply(e, { boussole: 'recResult', rid: d.rid, err: 'nomic' });
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined), chunks = [], t0 = Date.now();
      REC = { rec, cancel: false };
      recBox.innerHTML = '<div class="mic">🎙️</div><p class="sub">' + esc(d.titre || 'Enregistrement en cours…') + '</p><div class="t" id="rect">00:00</div><div class="bars">' + '<i></i>'.repeat(18) + '</div>'
        + '<div class="row"><button class="btn2" id="recx">✕ Annuler</button><button class="btn2 pri" id="recok">⏹️ Arrêter</button></div><p class="sub" style="margin-top:12px">3 minutes maximum</p>';
      recEl.classList.add('show');
      document.getElementById('recx').onclick = () => { REC.cancel = true; rec.stop(); };
      document.getElementById('recok').onclick = () => rec.stop();
      let ctx = null, raf = 0;
      try { const C = window.AudioContext || window.webkitAudioContext; ctx = new C(); const an = ctx.createAnalyser(); an.fftSize = 64; ctx.createMediaStreamSource(stream).connect(an);
        const buf = new Uint8Array(an.frequencyBinCount), bars = recBox.querySelectorAll('.bars i');
        const loop = () => { an.getByteFrequencyData(buf); bars.forEach((b, i) => { b.style.height = (12 + buf[(i * 2) % buf.length] / 255 * 88) + '%'; }); raf = requestAnimationFrame(loop); }; loop(); } catch (x) {}
      const timer = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000), el = document.getElementById('rect'); if (el) el.textContent = mmss(s); if (s >= 180) rec.stop(); }, 250);
      rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = () => {
        clearInterval(timer); cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); try { ctx && ctx.close(); } catch (x) {}
        const cancel = REC.cancel, dur = Math.max(1, Math.round((Date.now() - t0) / 1000)); REC = null; closeRec();
        if (cancel || !chunks.length) return reply(e, { boussole: 'recResult', rid: d.rid, err: 'cancel' });
        const fr = new FileReader(); fr.onload = () => reply(e, { boussole: 'recResult', rid: d.rid, data: fr.result, dur });
        fr.readAsDataURL(new Blob(chunks, { type: (rec.mimeType || 'audio/webm').split(';')[0] }));
      };
      rec.start(250);
    }).catch(err => reply(e, { boussole: 'recResult', rid: d.rid, err: err && err.name === 'NotAllowedError' ? 'denied' : 'nomic' }));
  }
  function startDict(e, d) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return reply(e, { boussole: 'dictEnd', rid: d.rid, err: 'nosupport' });
    const r = new SR(); r.lang = 'fr-FR'; r.interimResults = true; r.maxAlternatives = 1; let err = '';
    recBox.innerHTML = '<div class="mic">🗣️</div><b>Je t’écoute…</b><p class="sub">Parle normalement, en français</p><div class="live" id="dlive"></div><div class="row"><button class="btn2 pri" id="dok">✓ Terminé</button></div>';
    recEl.classList.add('show');
    document.getElementById('dok').onclick = () => { try { r.stop(); } catch (x) {} };
    r.onresult = ev => { const all = Array.from(ev.results), text = all.map(x => x[0].transcript).join(' ').replace(/\s+/g, ' ').trim(); const l = document.getElementById('dlive'); if (l) l.textContent = text;
      reply(e, { boussole: 'dictRes', rid: d.rid, text, final: all.every(x => x.isFinal) }); };
    r.onerror = ev => { err = ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'denied' : ev.error === 'no-speech' ? 'nospeech' : ev.error === 'aborted' ? '' : 'x'; };
    r.onend = () => { closeRec(); reply(e, { boussole: 'dictEnd', rid: d.rid, err }); };
    try { r.start(); } catch (x) { closeRec(); reply(e, { boussole: 'dictEnd', rid: d.rid, err: 'x' }); }
  }
})();
</script>
</body>
</html>
